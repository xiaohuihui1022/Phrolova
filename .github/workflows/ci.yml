name: CI - Code Review & Tests

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - '**'        # 所有分支的 push 都触发，排除 main/master（由 deploy.yml 处理）
      - '!main'
      - '!master'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  deployments: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: TypeScript 类型检查
  # ============================================================
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend + API types
        id: typecheck-frontend
        run: pnpm typecheck
        continue-on-error: false

      - name: Check cf-server (Durable Objects) types
        id: typecheck-server
        run: pnpm typecheck:server
        continue-on-error: false

      - name: Post summary
        if: always()
        run: |
          echo "### TypeScript 类型检查结果" >> $GITHUB_STEP_SUMMARY
          echo "- 前端/API 类型检查: ${{ steps.typecheck-frontend.outcome == 'success' && '✅ 通过' || '❌ 失败' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Durable Objects (cf-server) 类型检查: ${{ steps.typecheck-server.outcome == 'success' && '✅ 通过' || '❌ 失败' }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Job 2: 构建验证（确保代码能正常编译）
  # ============================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate placeholder wrangler.jsonc (required for build)
        run: |
          sed \
            -e "s|REPLACE_WITH_YOUR_D1_DATABASE_ID|00000000-0000-0000-0000-000000000000|g" \
            -e "s|REPLACE_WITH_YOUR_KV_NAMESPACE_ID|000000000000000000000000000000000000|g" \
            -e "s|REPLACE_WITH_YOUR_KV_PREVIEW_ID|000000000000000000000000000000000000|g" \
            wrangler.jsonc.example > wrangler.jsonc

      - name: Build frontend + Pages Worker
        id: build
        run: pnpm build
        timeout-minutes: 10

      - name: Check build artifacts exist
        run: |
          echo "### 构建产物检查" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            echo "- dist/ 目录: ✅ 存在" >> $GITHUB_STEP_SUMMARY
            echo "  - 文件数: $(find dist -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "  - 大小: $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- dist/ 目录: ❌ 不存在" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if [ -f "dist/_worker.js" ]; then
            echo "- dist/_worker.js (Pages Custom Worker): ✅ 存在" >> $GITHUB_STEP_SUMMARY
          else
            echo "- dist/_worker.js (Pages Custom Worker): ❌ 不存在" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # ============================================================
  # Job 3: 部署到 Cloudflare Pages Preview 环境（仅 PR 触发）
  # ============================================================
  preview-deploy:
    name: Deploy Preview (Cloudflare Pages)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Generate wrangler.jsonc
        run: |
          sed \
            -e "s|REPLACE_WITH_YOUR_D1_DATABASE_ID|${{ secrets.D1_DATABASE_ID }}|g" \
            -e "s|REPLACE_WITH_YOUR_KV_NAMESPACE_ID|${{ secrets.KV_NAMESPACE_ID }}|g" \
            -e "s|REPLACE_WITH_YOUR_KV_PREVIEW_ID|${{ secrets.KV_NAMESPACE_ID }}|g" \
            wrangler.jsonc.example > wrangler.jsonc

      - name: Deploy to Pages Preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --branch preview

      - name: Comment PR with Preview URL
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            if (!deployUrl) return;
            const prNumber = context.issue.number;
            const body = `### 🚀 Preview 部署成功\n\n**预览地址:** ${deployUrl}\n\n> 由 commit \`${context.sha.substring(0,7)}\` 触发，每次更新 PR 都会自动重新部署。`;
            // 查找已存在的评论并更新，避免重复
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existingComment = comments.data.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Preview 部署成功')
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}

  # ============================================================
  # Job 4: 代码审查总结（聚合所有 Job 结果）
  # ============================================================
  review-summary:
    name: Code Review Summary
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [typecheck, build, preview-deploy]
    steps:
      - name: Aggregate results
        uses: actions/github-script@v7
        with:
          script: |
            const typecheck = '${{ needs.typecheck.result }}';
            const build = '${{ needs.build.result }}';
            const preview = '${{ needs.preview-deploy.result }}';
            const status = (typecheck === 'success' && build === 'success') ? '✅ 所有检查通过' : '❌ 部分检查未通过';
            const body = `## 🧪 CI 代码审查报告\n\n**总体状态:** ${status}\n\n| 检查项 | 状态 |\n|--------|------|\n| TypeScript 类型检查 | ${typecheck === 'success' ? '✅ 通过' : typecheck === 'skipped' ? '⏭️ 跳过' : '❌ 失败'} |\n| 构建验证 | ${build === 'success' ? '✅ 通过' : build === 'skipped' ? '⏭️ 跳过' : '❌ 失败'} |\n| Preview 部署 | ${preview === 'success' ? '✅ 成功' : preview === 'skipped' ? '⏭️ 跳过（未配置 Secrets）' : '❌ 失败'} |\n\n---\n*点击 [这里](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 查看完整日志*`;
            const prNumber = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existingComment = comments.data.find(
              (c) => c.user.type === 'Bot' && c.body.includes('CI 代码审查报告')
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
