# Dependabot 配置
# 文档：https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ── npm 依赖（package.json / pnpm-lock.yaml） ──
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    # 小版本 / 补丁更新合并为一个 PR，减少噪音；大版本单独提 PR
    groups:
      vue-ecosystem:
        patterns:
          - "vue"
          - "vue-router"
          - "pinia"
          - "@vitejs/plugin-vue"
          - "vue-tsc"
      cloudflare-ecosystem:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      drizzle-ecosystem:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # 构建工具与类型库可自动合并补丁
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    labels:
      - "dependencies"

  # ── GitHub Actions 版本更新 ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(ci)"
      include: "scope"
    labels:
      - "dependencies"
